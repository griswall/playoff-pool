<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Score Importer - Hurd NFL Playoff Pool</title>

    <link rel="stylesheet" href="./assets/pool.css">
    <link rel="stylesheet" href="./assets/admin_importer.css">
    <script type="module" src="./assets/admin_importer.js"></script>
</head>
<body class="min-h-screen">

    <header class="main-header">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Bulk Score Importer</h1>
                <a href="admin.html" class="text-sm font-semibold text-[var(--accent)] hover:text-[var(--accent-hover)]">&larr; Back to Manual Entry</a>
            </div>
        </div>
    </header>
    <p id="page-status" hidden role="status" aria-live="polite" class="mx-auto max-w-3xl p-3 text-amber-200"></p>

    <main class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="content-section max-w-3xl mx-auto">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-4">Upload Scores CSV</h2>
            <p class="text-[var(--text-muted)] mb-6">
                Include WC, DIV, CONF, SB and either Player ID or Player Name. Use IDs for duplicate names. Blank cells leave scores unchanged. Zero clears points to 0.
            </p>

            <div id="file-drop-area" class="file-drop-area">
                <p class="text-[var(--text-muted)]">Drop a CSV here, or choose a file.</p>
                <input type="file" id="file-input" aria-label="Select score CSV" class="mt-3" accept=".csv, text/csv">
            </div>
            
            <p id="file-name" class="text-center mt-4 text-[var(--text-primary)]"></p>

            <div id="preview" class="mt-4 max-h-72 overflow-auto"></div>
            <div class="mt-6 text-right">
                <button id="upload-btn" class="upload-button" disabled>Save previewed changes</button>
            </div>

            <h3 class="text-lg font-semibold text-white mt-8 mb-3">Upload Log</h3>
            <div role="status" aria-live="polite" id="log-box" class="log-box">
                <p class="log-message">Waiting for file...</p>
            </div>
        </div>
    </main>

    <div role="status" aria-label="Loading" hidden id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-spinner" aria-label="Loading"></div>
    </div>

</body>
</html>
