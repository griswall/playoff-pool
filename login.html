<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hurd Pool">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    <title>Login - Hurd NFL Playoff Pool</title>

    <link rel="stylesheet" href="./assets/pool.css">
    <link rel="stylesheet" href="./assets/login.css">
    <script type="module" src="./assets/login.js"></script>
</head>
<body class="p-4">

    <div class="w-full max-w-md mx-auto space-y-8">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-gradient-to-br from-brand to-brand-dark shadow-[0_0_20px_rgba(0,208,132,0.4)] mb-4">
                <svg class="w-7 h-7 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight uppercase italic">Hurd <span class="text-brand">Pool</span></h1>
            <p class="text-gray-400 font-medium text-sm">Sign in to manage your lineup</p>
        </div>

        <div class="glass-panel p-8 rounded-2xl">

            <p id="page-status" hidden role="status" aria-live="polite" class="mx-auto max-w-3xl p-3 text-amber-200"></p>
            <form method="post" id="login-form" class="space-y-6">
                <div id="login-error-message" class="error-message hidden"></div>
                <div class="space-y-1">
                    <label for="login-email" class="block text-xs font-bold uppercase tracking-wider text-gray-400">Email Address</label>
                    <input type="email" id="login-email" required autocomplete="email"
                           class="form-input w-full p-3 rounded-lg text-sm" placeholder="you@example.com">
                </div>
                <div class="space-y-1">
                    <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-gray-400">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password"
                           class="form-input w-full p-3 rounded-lg text-sm" placeholder="••••••••">
                </div>
                <button type="submit" id="login-submit-button" class="w-full bg-brand hover:bg-brand-dark text-black font-black text-lg py-3 rounded-lg shadow-[0_0_15px_rgba(0,208,132,0.2)] transition-all uppercase tracking-wide mt-2">Sign In</button>
                <p class="text-sm text-center text-gray-400 pt-2">
                    <button id="forgot" type="button" class="toggle-link">Reset password</button><br>New to the pool?
                    <button type="button" id="toggle-to-signup" class="toggle-link">Create account</button>
                </p>
            </form>

            <form method="post" id="signup-form" class="space-y-6 hidden">
                <div id="signup-error-message" class="error-message hidden"></div>
                <div class="space-y-1">
                    <label for="signup-email" class="block text-xs font-bold uppercase tracking-wider text-gray-400">Email Address</label>
                    <input type="email" id="signup-email" required autocomplete="email"
                           class="form-input w-full p-3 rounded-lg text-sm" placeholder="you@example.com">
                </div>
                <div class="space-y-1">
                    <label for="signup-password" class="block text-xs font-bold uppercase tracking-wider text-gray-400">Create Password</label>
                    <input type="password" id="signup-password" required autocomplete="new-password" minlength="6"
                           class="form-input w-full p-3 rounded-lg text-sm" placeholder="At least 6 characters">
                </div>
                <button type="submit" id="signup-submit-button" class="w-full bg-brand hover:bg-brand-dark text-black font-black text-lg py-3 rounded-lg shadow-[0_0_15px_rgba(0,208,132,0.2)] transition-all uppercase tracking-wide mt-2">Create Account</button>
                <p class="text-sm text-center text-gray-400 pt-2">
                    Already have an account?
                    <button type="button" id="toggle-to-login" class="toggle-link">Sign in</button>
                </p>
            </form>

          <form method="post" id="reset-request" hidden class="space-y-4">
            <h2 class="text-xl font-bold">Reset your password</h2>
            <label for="reset-email">Email address</label><input id="reset-email" class="form-input w-full p-3 rounded" type="email" required autocomplete="email">
            <button class="bg-brand text-black rounded p-3 font-bold">Send reset link</button>
            <button type="button" class="toggle-link" id="back">Back to sign in</button>
          </form>
          <form method="post" id="reset-complete" hidden class="space-y-4">
            <h2 class="text-xl font-bold">Choose a new password</h2>
            <label for="new-password">New password</label><input id="new-password" class="form-input w-full p-3 rounded" type="password" required minlength="6" autocomplete="new-password">
            <button class="bg-brand text-black rounded p-3 font-bold">Update password</button>
          </form>

        </div>
    </div>

</body>
</html>
